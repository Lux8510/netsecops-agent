frr defaults traditional
hostname r4
log stdout
service integrated-vtysh-config
!
interface eth1
 description r4-to-r2-primary
 ip address 10.24.0.2/30
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
 description r4-to-r3-backup
 ip address 10.34.0.2/30
 ip ospf network point-to-point
 ip ospf cost 50
!
interface eth3
 description r4-to-server
 ip address 10.104.0.1/30
!
interface lo
 ip address 10.255.1.4/32
!
router ospf
 ospf router-id 10.255.1.4
 network 10.24.0.0/30 area 0.0.0.0
 network 10.34.0.0/30 area 0.0.0.0
 network 10.104.0.0/30 area 0.0.0.0
 network 10.255.1.4/32 area 0.0.0.0
 passive-interface eth3
 passive-interface lo
!
line vty
!
