frr defaults traditional
hostname r2
log stdout
service integrated-vtysh-config
!
interface eth1
 description r2-to-r1-primary
 ip address 10.12.0.2/30
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
 description r2-to-r4-primary
 ip address 10.24.0.1/30
 ip ospf network point-to-point
 ip ospf cost 10
!
interface lo
 ip address 10.255.1.2/32
!
router ospf
 ospf router-id 10.255.1.2
 network 10.12.0.0/30 area 0.0.0.0
 network 10.24.0.0/30 area 0.0.0.0
 network 10.255.1.2/32 area 0.0.0.0
 passive-interface lo
!
line vty
!
