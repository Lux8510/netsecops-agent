frr defaults traditional
hostname r3
log stdout
service integrated-vtysh-config
!
interface eth1
 description r3-to-r1-backup
 ip address 10.13.0.2/30
 ip ospf network point-to-point
 ip ospf cost 50
!
interface eth2
 description r3-to-r4-backup
 ip address 10.34.0.1/30
 ip ospf network point-to-point
 ip ospf cost 50
!
interface lo
 ip address 10.255.1.3/32
!
router ospf
 ospf router-id 10.255.1.3
 network 10.13.0.0/30 area 0.0.0.0
 network 10.34.0.0/30 area 0.0.0.0
 network 10.255.1.3/32 area 0.0.0.0
 passive-interface lo
!
line vty
!
