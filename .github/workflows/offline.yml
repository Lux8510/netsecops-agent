name: Offline regression and replay workbench

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  offline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-progress.txt
      - name: Install bounded local service test dependencies
        run: python -m pip install -r requirements-progress.txt
      - name: Core agent suite and v1 topology suite in clean copies
        run: python -B run_offline_tests.py
      - name: Check publishable examples and documentation links
        run: python -B tools/check_publication.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install front-end dependencies
        working-directory: web
        run: npm ci
      - name: Type check, unit tests and build
        working-directory: web
        run: npm run check
